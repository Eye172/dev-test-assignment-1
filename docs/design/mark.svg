<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="orbit-gtm-mark-title">
  <title id="orbit-gtm-mark-title">Orbit GTM Studio</title>
  <!-- Open orbit: 310° arc with a gap in the upper-right quadrant -->
  <path d="M25.40 12.58 A10 10 0 1 1 19.42 6.60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Core: the market -->
  <circle cx="16" cy="16" r="3" fill="currentColor"/>
  <!-- The startup leaving orbit through the gap: go-to-market -->
  <circle class="mark-launch" cx="25.9" cy="6.1" r="2.75" fill="var(--mark-accent, #00ff5a)"/>
</svg>
